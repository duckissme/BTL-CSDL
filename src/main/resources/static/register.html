<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký nhân viên</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #eef1f6;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .box {
            width: 400px;
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        h2 {
            text-align: center;
            margin: 0 0 10px 0;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #cfd6dd;
            border-radius: 6px;
            box-sizing: border-box;
            background: #fafbfc;
        }

        input:focus, select:focus {
            border-color: #1976d2;
            outline: none;
        }

        /* Bỏ mũi tên tăng giảm của input[type=number] */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield; /* Firefox */
        }

        button {
            padding: 10px;
            font-size: 15px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #125a9e;
        }

        #result {
            text-align: center;
            font-weight: 600;
            min-height: 20px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="box">
    <h2>Đăng ký nhân viên</h2>

    <input id="employee_id" type="text" maxlength="10" placeholder="Mã nhân viên">
    <input id="full_name" placeholder="Họ tên">

    <select id="gender">
        <option value="">Chọn giới tính</option>
        <option value="Nam">Nam</option>
        <option value="Nữ">Nữ</option>
        <option value="Khác">Khác</option>
    </select>

    <input id="dob" type="date">

    <select id="position_name">
        <option value="">Chọn chức vụ</option>
        <option value="Giám đốc">Giám đốc</option>
        <option value="Quản lý">Quản lý</option>
        <option value="Kế toán">Kế toán</option>
        <option value="Quản lý nhân sự">Quản lý nhân sự</option>
        <option value="Nhân viên">Nhân viên</option>
    </select>

    <input id="phone" placeholder="SĐT">
    <input id="address" placeholder="Địa chỉ">
    <input id="email" type="email" placeholder="Email">

    <select id="employment_contract">
        <option value="">Chọn loại hợp đồng</option>
        <option value="Chính thức">Chính thức</option>
        <option value="Thực tập">Thực tập</option>
        <option value="Thử việc">Thử việc</option>
    </select>

    <input id="basic_salary" type="number" placeholder="Lương cơ bản" step="1000">

    <button onclick="register()">Đăng ký</button>

    <p id="result"></p>
</div>

<script>
async function register() {
    const params = new URLSearchParams();

    const empId = document.getElementById("employee_id").value;
    if(empId) params.append("employee_id", empId);

    params.append("full_name", document.getElementById("full_name").value);
    params.append("gender", document.getElementById("gender").value);
    params.append("date_of_birth", document.getElementById("dob").value);
    params.append("position_name", document.getElementById("position_name").value);
    params.append("phone", document.getElementById("phone").value);
    params.append("address", document.getElementById("address").value);
    params.append("email", document.getElementById("email").value);
    params.append("employment_contract", document.getElementById("employment_contract").value);

    const salary = document.getElementById("basic_salary").value;
    if(salary) params.append("basic_salary", salary);

    try {
        const res = await fetch("/api/register", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: params
        });

        const text = await res.text();
        const resultEl = document.getElementById("result");
        resultEl.innerText = text;
        resultEl.style.color = res.ok ? "green" : "red";

        // Nếu đăng ký thành công → quay về employee.html
        if (text.includes("Đăng ký nhân viên thành công")) {
            setTimeout(() => {
                window.location.href = "employee.html";
            }, 1200);
        }

    } catch (err) {
        const resultEl = document.getElementById("result");
        resultEl.innerText = "Lỗi kết nối server!";
        resultEl.style.color = "red";
    }
}
</script>
</body>
</html>
