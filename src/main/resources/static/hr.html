<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>HR Management</title>
<style>
/* ====================== BODY ====================== */
body { 
    font-family: Arial, sans-serif; 
    background: #f2f4f7; 
    margin: 0; 
    padding: 20px; 
    display: flex;
    justify-content: center;
    overflow-y: scroll;
}

/* ====================== CONTAINER ====================== */
.container { 
    width: 95%;
    max-width: 1400px; 
    padding: 10px;
    box-sizing: border-box;
}

/* ====================== TABS ====================== */
.tabs { 
    display: flex; 
    border-bottom: 2px solid #1976d2; 
    margin-bottom: 15px; 
    cursor: pointer; 
}
.tab { 
    padding: 10px 18px; 
    border: 1px solid #1976d2; 
    border-bottom: none; 
    background: white; 
    margin-right: 6px; 
    border-radius: 6px 6px 0 0; 
    font-size: 14px;
}
.tab.active { 
    background: #1976d2; 
    color: white; 
}

/* ====================== BOX ====================== */
.box { 
    background: white; 
    padding: 15px;
    border-radius: 6px; 
    box-shadow: 0 0 6px #ccc; 
    width: 100%;
    margin: 0 auto; 
    overflow-x: auto; /* nếu bảng dài quá sẽ scroll */
}

/* ====================== TABLE ====================== */
table { 
    width: 100%; 
    border-collapse: collapse; 
    margin-top: 8px; 
    table-layout: fixed; /* cột ổn định */
}

th, td { 
    border: 1px solid #ddd; 
    padding: 6px 4px;
    text-align: center; 
    vertical-align: middle; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
    font-size: 14px;
}

th { 
    background: #1976d2; 
    color: white; 
}

/* ====================== CỘT CỐ ĐỊNH ====================== */
#employeeTable th:nth-child(1){ width: 140px; }
#employeeTable th:nth-child(2){ width: 160px; }
#employeeTable th:nth-child(3){ width: 110px; }
#employeeTable th:nth-child(4){ width: 90px; }
#employeeTable th:nth-child(5){ width: 160px; }
#employeeTable th:nth-child(6){ width: 120px; }
#employeeTable th:nth-child(7){ width: 130px; }
#employeeTable th:nth-child(8){ width: 140px; }
#employeeTable th:nth-child(9){ width: 120px; }

/* ====================== INPUT/SELECT ====================== */
table input {
    width: 95%; 
    height: 32px; 
    box-sizing: border-box; 
    padding: 3px; 
    font-size: 13px;
}

table select {
    width: auto;           /* width vừa đủ option dài nhất */
    min-width: 80px;
    max-width: 180px;
    padding: 3px 6px;
    font-size: 13px;
    box-sizing: border-box;
}

/* ====================== CHECK IN/OUT ====================== */
.col-check { width: 100px; }
.check-wrapper {
    height: 34px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ====================== BUTTONS ====================== */
button { 
    background: #1976d2; 
    color: white; 
    border: none; 
    border-radius: 4px; 
    cursor: pointer; 
    padding: 6px 12px;
    font-size: 13px;
}
button:hover { opacity: 0.9; }

.flex { 
    display: flex; 
    gap: 8px; 
    align-items: center; 
    margin-bottom: 10px;
}
.flex input { flex: 1; }

.button-group { 
    display: flex; 
    justify-content: center; 
    gap: 5px; 
}
.button-group button { 
    padding: 4px 8px; 
    font-size: 12px; 
}
</style>
</head>
<body>
<div class="container">

<!-- ====================== TABS ====================== -->
<div class="tabs">
    <div class="tab active" onclick="showTab('employee')">Quản lý nhân viên</div>
    <div class="tab" onclick="showTab('timekeeping')">Quản lý chấm công</div>
</div>

<!-- ====================== EMPLOYEE TAB ====================== -->
<div id="employee" class="box">
    <div class="flex">
        <input type="text" id="searchEmployee" placeholder="Tìm kiếm theo họ tên">
        <button onclick="loadEmployees()">Tìm kiếm</button>
    </div>
    <table id="employeeTable">
        <thead>
            <tr>
                <th>Họ tên</th>
                <th>Chức vụ</th>
                <th>Ngày sinh</th>
                <th>Giới tính</th>
                <th>Email</th>
                <th>SĐT</th>
                <th>Trạng thái</th>
                <th>Loại HĐ</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<!-- ====================== TIMEKEEPING TAB ====================== -->
<div id="timekeeping" class="box" style="display:none;">
    <div class="flex">
        <label>Chọn ngày:</label>
        <input type="date" id="datePicker">
        <button onclick="loadTimekeeping()">Xem</button>
    </div>
    <div class="flex">
        <input type="text" id="searchTimekeeping" placeholder="Tìm kiếm theo họ tên">
        <button onclick="loadTimekeeping()">Tìm kiếm</button>
    </div>
    <table id="timekeepingTable">
        <thead>
            <tr>
                <th>Họ tên</th>
                <th>Ngày</th>
                <th>Giờ vào</th>
                <th>Giờ ra</th>
                <th>Tăng ca</th>
                <th>Trạng thái</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

</div>

<script>
let positions = [];

/* ====================== LOAD POSITIONS ====================== */
async function loadPositions(){
    const res = await fetch('/api/hr/positions'); 
    positions = await res.json();
}

/* ====================== TABS ====================== */
function showTab(name){
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.box').forEach(b => b.style.display = 'none');
    document.getElementById(name).style.display = 'block';
    document.querySelector(`.tab[onclick="showTab('${name}')"]`).classList.add('active');
}

/* ====================== LOAD EMPLOYEES ====================== */
async function loadEmployees(){
    const search = document.getElementById("searchEmployee").value;
    const res = await fetch('/api/hr/employees' + (search ? '?search=' + search : ''));
    const data = await res.json();
    const tbody = document.querySelector("#employeeTable tbody");
    tbody.innerHTML = "";
    data.forEach(emp=>{
        const tr = document.createElement("tr");
        tr.setAttribute("data-id", emp.employee_id);
        tr.innerHTML = `
            <td>${emp.full_name}</td>
            <td>${emp.position_name || ''}</td>
            <td>${emp.date_of_birth || ''}</td>
            <td>${emp.gender || ''}</td>
            <td>${emp.email || ''}</td>
            <td>${emp.phone || ''}</td>
            <td>${emp.work_status || ''}</td>
            <td>${emp.contract_type || ''}</td>
            <td>
                <div class="button-group">
                    <button onclick="deleteEmployee(${emp.employee_id})">Xóa</button>
                    <button onclick="updateEmployee(${emp.employee_id})">Cập nhật</button>
                </div>
            </td>`;
        tbody.appendChild(tr);
    });
}

/* ====================== DELETE ====================== */
async function deleteEmployee(id){
    if(!confirm("Bạn có chắc chắn muốn xóa nhân viên?")) return;
    const res = await fetch('/api/hr/employees/'+id, { method:'DELETE' });
    alert(await res.text());
    loadEmployees();
}

/* ====================== UPDATE ====================== */
function updateEmployee(id){
    const tr = document.querySelector(`#employeeTable tr[data-id='${id}']`);
    const tds = tr.querySelectorAll("td");

    tds[0].innerHTML = `<input type="text" value="${tds[0].textContent}">`;
    tds[1].innerHTML = `<select>${positions.map(p => `<option ${p.position_name===tds[1].textContent ? 'selected':''}>${p.position_name}</option>`).join('')}</select>`;
    tds[2].innerHTML = `<input type="date" value="${tds[2].textContent}">`;
    tds[3].innerHTML = `
        <select>
            <option value="Nam"  ${tds[3].textContent==="Nam"?"selected":""}>Nam</option>
            <option value="Nữ"   ${tds[3].textContent==="Nữ"?"selected":""}>Nữ</option>
            <option value="Khác" ${tds[3].textContent==="Khác"?"selected":""}>Khác</option>
        </select>`;
    tds[4].innerHTML = `<input type="email" value="${tds[4].textContent}">`;
    tds[5].innerHTML = `<input type="text" value="${tds[5].textContent}">`;
    tds[6].innerHTML = `<select>
        <option>Đang làm việc</option>
        <option>Đã nghỉ</option>
    </select>`;
    tds[7].innerHTML = `<select>
        <option>Chính thức</option>
        <option>Thử việc</option>
        <option>Thời vụ</option>
        <option>Thực tập</option>
    </select>`;
    tds[8].innerHTML = `<div class="button-group">
        <button onclick="saveEmployee(${id})">Lưu</button>
        <button onclick="cancelUpdate()">Hủy</button>
    </div>`;
}

async function saveEmployee(id){
    const tr = document.querySelector(`#employeeTable tr[data-id="${id}"]`);
    const tds = tr.querySelectorAll("td");
    const params = new URLSearchParams();
    params.append('fullName', tds[0].querySelector("input").value);
    params.append('positionName', tds[1].querySelector("select").value);
    params.append('dateOfBirth', tds[2].querySelector("input").value);
    params.append('gender', tds[3].querySelector("select").value);
    params.append('email', tds[4].querySelector("input").value);
    params.append('phone', tds[5].querySelector("input").value);
    params.append('workStatus', tds[6].querySelector("select").value);
    params.append('contractType', tds[7].querySelector("select").value);
    const res = await fetch(`/api/hr/employees/${id}?${params.toString()}`, { method:'PUT' });
    alert(await res.text());
    loadEmployees();
}

function cancelUpdate(){ loadEmployees(); }

/* ====================== TIMEKEEPING ====================== */
function getCurrentTime(){ return new Date().toTimeString().split(" ")[0]; }

async function doCheckIn(empId, date, btn){
    const time = getCurrentTime();
    await fetch(`/api/timekeeping/update?employeeId=${empId}&date=${date}&checkIn=${time}&workStatus=Đi làm`, { method:'POST' });
    btn.parentElement.innerHTML = `<div class="check-wrapper">${time}</div>`;
}

async function doCheckOut(empId, date, btn){
    const time = getCurrentTime();
    await fetch(`/api/timekeeping/update?employeeId=${empId}&date=${date}&checkOut=${time}&workStatus=Đi làm`, { method:'POST' });
    btn.parentElement.innerHTML = `<div class="check-wrapper">${time}</div>`;
}

async function updateStatus(empId, date, status){
    await fetch(`/api/timekeeping/update?employeeId=${empId}&date=${date}&workStatus=${status}`, { method:'POST' });
}

async function loadTimekeeping(){
    const date = document.getElementById("datePicker").value;
    const search = document.getElementById("searchTimekeeping").value;
    if(!date){ alert("Chọn ngày trước!"); return; }
    await fetch('/api/timekeeping/generate?date='+date, { method:'POST' });

    let url = `/api/timekeeping?date=${date}`;
    if(search) url += '&search=' + encodeURIComponent(search);
    const res = await fetch(url);
    const data = await res.json();

    const tbody = document.querySelector("#timekeepingTable tbody");
    tbody.innerHTML = "";
    const statusEnum = ['Đi làm', 'Nghỉ phép', 'Vắng mặt'];
    data.forEach(tk=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${tk.full_name}</td>
            <td>${tk.date}</td>
            <td class="col-check"><div class="check-wrapper">${tk.check_in || `<button onclick="doCheckIn(${tk.employee_id}, '${tk.date}', this)">Check In</button>`}</div></td>
            <td class="col-check"><div class="check-wrapper">${tk.check_out || `<button onclick="doCheckOut(${tk.employee_id}, '${tk.date}', this)">Check Out</button>`}</div></td>
            <td>${tk.overtime || 0}</td>
            <td><select onchange="updateStatus(${tk.employee_id}, '${tk.date}', this.value)">${statusEnum.map(s => `<option value="${s}" ${s===tk.work_status?'selected':''}>${s}</option>`).join('')}</select></td>
        `;
        tbody.appendChild(tr);
    });
}

loadPositions().then(loadEmployees);
</script>
</body>
</html>
